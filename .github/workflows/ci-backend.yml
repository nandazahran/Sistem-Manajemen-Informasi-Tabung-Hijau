# =============================================================
# CI Backend (Rust) — Compile Check, Linting, dan Unit Test
# =============================================================
# Workflow ini berjalan otomatis setiap ada Push atau Pull Request
# ke branch 'main' yang mengubah file di folder sim-th-backend/.

name: CI Backend (Rust)

on:
  push:
    branches: [main]
    paths:
      - 'sim-th-backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'sim-th-backend/**'

# Jika ada push baru saat CI sedang jalan, batalkan yang lama
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------
  # Job 1: Compile Check — Pastikan kode bisa dikompilasi
  # -------------------------------------------------------
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim-th-backend

    steps:
      - name: Checkout kode sumber
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-th-backend -> target

      - name: Jalankan cargo check
        run: cargo check --locked

  # -------------------------------------------------------
  # Job 2: Clippy Linting — Deteksi code smells & bad practice
  # -------------------------------------------------------
  clippy:
    name: Clippy Linting
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: sim-th-backend

    steps:
      - name: Checkout kode sumber
        uses: actions/checkout@v4

      - name: Setup Rust toolchain dengan Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-th-backend -> target

      - name: Jalankan Clippy
        run: cargo clippy -- -D warnings

  # -------------------------------------------------------
  # Job 3: Unit Test — Eksekusi semua test case
  # -------------------------------------------------------
  test:
    name: Cargo Test
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: sim-th-backend

    steps:
      - name: Checkout kode sumber
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-th-backend -> target

      - name: Jalankan unit test
        run: cargo test --locked
